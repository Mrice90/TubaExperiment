name: Core engine CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: gradle test :game-gui:distZip --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: infinite-conquest-desktop-alpha
          path: game-gui/build/distributions/*.zip
          if-no-files-found: error
