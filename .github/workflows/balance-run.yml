name: Balance simulation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Matches per Capital pairing
        required: false
        default: "10"
      seed:
        description: Deterministic base seed
        required: false
        default: "42"

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run balance simulation
        run: gradle :game-cli:run --no-daemon --args="simulate ${{ inputs.repetitions || '10' }} ${{ inputs.seed || '42' }} balance-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: game-cli/balance-report.json
